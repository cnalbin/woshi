name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
        working-directory: server
      - run: npm test
        working-directory: server

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Test metabolism, validation, and calendar logic
        run: swift test
      - name: Build and verify unsigned device IPA
        run: bash scripts/build-ipa.sh
      - name: Upload IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: QingJi-unsigned-IPA
          path: |
            build/QingJi-unsigned.ipa
            build/QingJi-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Test real app onboarding, saving and process restart
        run: bash scripts/test-ui.sh
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots
          fi
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QingJi-simulator-screenshots
          path: build/screenshots
          if-no-files-found: warn
